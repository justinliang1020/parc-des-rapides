<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PARC DES RAPIDES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <video width="480" autoplay muted loop playsinline>
      <source src="assets/rapids.mp4" type="video/mp4" />
    </video>
    <video width="480" autoplay muted loop playsinline>
      <source src="assets/sign.mp4" type="video/mp4" />
    </video>
    <video width="480" autoplay muted loop playsinline>
      <source src="assets/lake.mp4" type="video/mp4" />
    </video>
    <audio
      id="myAudio"
      src="assets/ambient.m4a"
      type="audio/m4a"
      autoplay
      muted
      loop
    ></audio>
    <div id="toolbar">
      <div id="title">
        <p>
          <a
            href="https://fr.wikipedia.org/wiki/Parc_des_Rapides_(Montr%C3%A9al)"
            target="_blank"
          >
            PARC DES RAPIDES, LASALLE, QUEBEC
          </a>
        </p>
        <p>
          <a
            href="https://en.wikipedia.org/wiki/Des_Rapides_Park"
            target="_blank"
          >
            RAPIDS PARK
          </a>
        </p>
      </div>
      <button
        id="mute-toggle"
        style="top: 100px; left: 300px"
        onclick="
  const audio = document.getElementById('myAudio');
  if (audio.paused) audio.play();  // Ensure playback starts
  audio.muted = !audio.muted;
  this.textContent = audio.muted ? '🔇' : '🔈';
"
      >
        🔇
      </button>
    </div>
    <a
      href="/confrontation"
      style="left: 0px; top: 393px; width: 477px; height: 90px"
      id="hyperimage"
      target="_blank"
    ></a>
  </body>
</html>
